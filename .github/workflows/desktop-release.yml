# One tag publishes both platforms to one feed.
#
# The Windows workflow already built an installer, but Linux had no release job
# at all, so the AppImage could never find an update. Both artifacts now land on
# the same GitHub Release, which is the feed electron-updater reads.
name: Desktop release

on:
  push:
    tags:
      - "v*"

# Releases land in duaragha/serena-releases, not here, so this workflow needs
# no write access to its own repository.
permissions:
  contents: read

jobs:
  linux:
    name: AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop-electron/package-lock.json

      - name: Refuse a tag that disagrees with the app version
        run: |
          expected="v$(node -p "require('./desktop-electron/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $expected" >&2
            exit 1
          fi

      - name: Build the Python environment the sidecar is frozen from
        run: |
          python -m venv .venv
          ./.venv/bin/python -m pip install --disable-pip-version-check -e ".[dev]"
          ./.venv/bin/python -m pip install --disable-pip-version-check pyinstaller

      - name: Prove the update surface before shipping it
        working-directory: desktop-electron
        run: |
          npm ci
          node --test tests/updates.test.cjs tests/menu.test.cjs

      - name: Build and publish the AppImage
        working-directory: desktop-electron
        env:
          # Scoped to serena-releases only; GITHUB_TOKEN cannot write to
          # another repository.
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: npm run release:linux

      - uses: actions/upload-artifact@v4
        with:
          name: Serena-Linux-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop-electron/dist/Serena-*.AppImage
            desktop-electron/dist/latest-linux.yml

  windows:
    name: NSIS installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-windows.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop-electron/package-lock.json

      - name: Refuse a tag that disagrees with the app version
        shell: pwsh
        run: |
          $expected = "v$((Get-Content desktop-electron/package.json -Raw | ConvertFrom-Json).version)"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "tag $env:GITHUB_REF_NAME does not match package version $expected"
          }

      - name: Create the Windows build environment
        shell: pwsh
        run: python -m venv .venv

      - name: Prove the update surface before shipping it
        working-directory: desktop-electron
        shell: pwsh
        run: |
          npm ci
          node --test tests/updates.test.cjs tests/menu.test.cjs

      - name: Build and publish the installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          # Signing is optional: without a certificate the build still ships,
          # it just cannot prove the publisher. See
          # windows/make-signing-cert.ps1 for the free self-signed route.
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: .\desktop-electron\windows\build-win.ps1 -Publish

      - uses: actions/upload-artifact@v4
        with:
          name: Serena-Windows-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop-electron/dist/windows/Serena-Setup-*.exe
            desktop-electron/dist/windows/latest.yml
