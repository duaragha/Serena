name: Windows desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package-windows:
    name: Package Windows desktop
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-windows.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop-electron/package-lock.json

      - name: Verify the release tag matches the desktop version
        shell: pwsh
        run: |
          $package = Get-Content desktop-electron/package.json -Raw | ConvertFrom-Json
          $expected = "v$($package.version)"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "tag $env:GITHUB_REF_NAME does not match package version $expected"
          }

      - name: Create the Windows build environment
        shell: pwsh
        run: python -m venv .venv

      - name: Test, build, and publish the NSIS release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .\desktop-electron\windows\build-win.ps1 -Publish

      - name: Upload the release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Serena-Windows-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop-electron/dist/windows/Serena-Setup-*.exe
            desktop-electron/dist/windows/Serena-Setup-*.exe.blockmap
            desktop-electron/dist/windows/latest.yml

