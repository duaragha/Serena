# Windows packaging, proven before a tag exists.
#
# This workflow deliberately does NOT publish, and deliberately does not run on
# tags. desktop-release.yml owns releasing: it builds Linux first and Windows
# second precisely because both jobs upload into one GitHub Release and would
# otherwise race to create it. A second tag-triggered publisher would reopen
# exactly that race and hand one of the two a 422 on an existing tag.
#
# What was missing is the other half: until now the Windows installer was only
# ever built by the release job, so a broken spec, a missing hidden import or a
# drifted electron-builder config surfaced while cutting a release, after the
# Linux job had already published. This runs the same build-win.ps1 on the same
# runner whenever the packaged surface changes, so that failure lands on the
# pull request instead.
name: Windows desktop build

# The path lists are spelled out twice on purpose: GitHub's workflow parser
# does not expand YAML anchors, so a &/* pair here silently filters nothing.
on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/windows-desktop.yml"
      - "desktop-electron/windows/**"
      - "desktop-electron/*.js"
      - "desktop-electron/package.json"
      - "desktop-electron/package-lock.json"
      - "desktop-electron/sidecar.py"
      - "requirements-windows.txt"
      - "pyproject.toml"
      - "ui/**"
      - "core/**"
  pull_request:
    paths:
      - ".github/workflows/windows-desktop.yml"
      - "desktop-electron/windows/**"
      - "desktop-electron/*.js"
      - "desktop-electron/package.json"
      - "desktop-electron/package-lock.json"
      - "desktop-electron/sidecar.py"
      - "requirements-windows.txt"
      - "pyproject.toml"
      - "ui/**"
      - "core/**"
  workflow_dispatch:

# Validation only. Nothing here is allowed to touch a release.
permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: NSIS installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-windows.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop-electron/package-lock.json

      # The same guard the release job runs. It asserts, among other things,
      # that windows/electron-builder.win.yml and package.json still describe
      # one identical update feed; left to drift, one platform quietly stops
      # seeing updates and nothing fails until a user is already stranded.
      - name: Prove the update surface
        working-directory: desktop-electron
        shell: pwsh
        run: |
          npm ci
          node --test tests/updates.test.cjs tests/menu.test.cjs

      - name: Create the Windows build environment
        shell: pwsh
        run: python -m venv .venv

      # No -Publish: build-win.ps1 then passes --publish never to
      # electron-builder. It installs the Windows dependencies, runs the mocked
      # ConPTY tests, freezes the onedir sidecar, boots that frozen exe and
      # polls /api/health, then builds the NSIS installer.
      - name: Build the installer
        shell: pwsh
        run: .\desktop-electron\windows\build-win.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: Serena-Windows-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            desktop-electron/dist/windows/Serena-Setup-*.exe
            desktop-electron/dist/windows/latest.yml
