name: Selective stable promotion
run-name: Promotion ${{ inputs.mode }} ${{ inputs.request }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verification only, or publish after both platform gates
        type: choice
        options: [verify, publish]
        default: verify
        required: true
      resume_run:
        description: Optional failed run whose exact candidate and successful Windows gate are reused
        required: false
      dev_tag:
        description: Optional complete Dev release to promote (all features required)
        required: false
      dev_commit:
        description: Exact reviewed commit of that Dev tag
        required: false
      source:
        description: Reviewed catalog source commit (40 hex characters)
        required: true
      stable:
        description: Reviewed current stable tag
        required: true
      selected:
        description: JSON array of selected feature IDs
        required: true
      tested:
        description: JSON array of feature IDs you have tested
        required: true
      request:
        description: Unique request ID (32 hex characters)
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: serena-stable-promotion
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix apps/desktop ci --ignore-scripts
      - name: Check all registered feature combinations
        run: node --test tests/promotion-composition.test.cjs tests/full-promotion.test.cjs tests/promotion-resume.test.cjs
      - name: Validate request and assemble only selected patches
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_RESUME_RUN: ${{ inputs.resume_run }}
          PROMOTION_DEV_TAG: ${{ inputs.dev_tag }}
          PROMOTION_DEV_COMMIT: ${{ inputs.dev_commit }}
          PROMOTION_SOURCE: ${{ inputs.source }}
          PROMOTION_STABLE: ${{ inputs.stable }}
          PROMOTION_SELECTED: ${{ inputs.selected }}
          PROMOTION_TESTED: ${{ inputs.tested }}
          PROMOTION_REQUEST: ${{ inputs.request }}
          PROMOTION_MODE: ${{ inputs.mode }}
        run: |
          if [ -n "$PROMOTION_RESUME_RUN" ]; then
            node scripts/resume-promotion.cjs
          else
            node scripts/prepare-promotion.cjs
          fi
      - uses: actions/upload-artifact@v4
        if: inputs.resume_run != ''
        with:
          name: candidate-windows
          path: resumed-windows/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-source
          path: |
            candidate.bundle
            promotion-plan.json
            resumed-from.json
          if-no-files-found: error
          retention-days: 14

  linux:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: candidate-source
      - run: git clone --branch candidate candidate.bundle candidate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install candidate dependencies
        working-directory: candidate
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[dev,workspace,browser]' pyinstaller playwright==1.58.0
          .venv/bin/python -m playwright install --with-deps chromium
          npm --prefix apps/desktop ci
      - name: Prepare complete Dev desktop test environment
        if: inputs.dev_tag != ''
        working-directory: candidate
        run: |
          sudo apt-get update
          sudo apt-get install -y xdotool xinput x11-xserver-utils tmux
          git config --global user.name 'Serena CI'
          git config --global user.email 'ci@serena.invalid'
          .venv/bin/python - <<'PYTHON'
          import asyncio, os, pathlib, subprocess, tempfile
          from playwright.sync_api import sync_playwright
          from core.computer_browser import launch
          with sync_playwright() as p:
              binary = pathlib.Path(p.chromium.executable_path)
          # Install Chromium's own sandbox helper on this disposable runner.
          # Keep the browser sandbox enabled, including direct CDP fixtures.
          helper = next(p for p in (binary.with_name('chrome_sandbox'), binary.with_name('chrome-sandbox')) if p.exists())
          sandbox = '/usr/local/lib/serena-ci-chrome-sandbox'
          subprocess.run(['sudo', 'install', '-o', 'root', '-g', 'root', '-m', '4755', str(helper), sandbox], check=True)
          os.environ['CHROME_DEVEL_SANDBOX'] = sandbox
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('CHROME_DEVEL_SANDBOX=' + sandbox + '\n')
          test_bin = pathlib.Path(os.environ['RUNNER_TEMP']) / 'serena-test-bin'
          test_bin.mkdir()
          (test_bin / 'chromium').symlink_to(binary)
          with open(os.environ['GITHUB_PATH'], 'a') as stream:
              stream.write(str(test_bin) + '\n')
          with tempfile.TemporaryDirectory(prefix='ci-browser-proof-') as scratch:
              browser = asyncio.run(launch(binary, pathlib.Path(scratch) / 'profile', headless=True))
              browser.close()
          print('Sandboxed Chromium CDP launch passed')
          PYTHON
      - name: Use reviewed browser synchronization fixtures for the resumed candidate
        if: inputs.resume_run != ''
        run: |
          cp tests/test_terminal_peer_sleep_ui.py candidate/tests/test_terminal_peer_sleep_ui.py
          cp tests/test_workspace_app.py candidate/tests/test_workspace_app.py
      - name: Candidate shell, sidebar and original CLI regression gates
        working-directory: candidate
        run: |
          npm --prefix apps/desktop test
          if [ -f apps/desktop/tests/test_voice_packaging.py ]; then
            .venv/bin/python -m pytest -q --tb=short tests/test_desktop_dependencies.py apps/desktop/tests/test_voice_packaging.py
          fi
          if [ -f tests/test_workspace_chat_trash.py ]; then
            .venv/bin/python -m pytest -q --tb=short tests/test_group_unlink_member.py tests/test_autolink.py tests/test_session_recovery.py tests/test_external_runtime_metadata.py tests/test_work_project_metadata.py tests/test_workspace_chat_trash.py
          fi
          if [ -f tests/test_fleet_report_visibility.py ]; then
            .venv/bin/python -m pytest -q --tb=short tests/test_fleet_report_visibility.py tests/test_web_terminal_performance.py
          fi
          .venv/bin/python -m pytest -q --tb=short tests/test_workspace_browser.py tests/test_fleet_chat_sidebar.py tests/test_voice_created_chat_sidebar.py tests/test_session_sidebar_completeness.py tests/test_workspace_desktop_editions.py tests/test_terminal*.py tests/test_linked_terminal*.py tests/test_pty_terminal_runtime.py tests/test_desktop_shell_parity.py
      - name: Prove complete Dev workspace and backend changes
        if: inputs.dev_tag != ''
        working-directory: candidate
        run: |
          node --test tests/workspace*.test.mjs
          .venv/bin/python -m pytest -q --tb=short tests/test_workspace*.py tests/test_computer*.py tests/test_app_accessibility.py tests/test_chat*.py tests/test_codex*.py tests/test_index_refresh_packaged.py tests/test_memory_tasks.py tests/test_scheduler*.py tests/test_journal.py tests/test_doctor*.py tests/test_security_policy.py tests/test_serena_policy.py tests/test_telegram_line.py tests/test_sidestore_publish.py tests/test_pc_game_mode.py tests/test_docker_cache_maintenance.py tests/test_agent_company.py tests/test_brain_router.py tests/test_brain_daemon_permissions.py tests/test_bounded_automation.py tests/test_session_identity.py tests/test_session_cost.py
      - name: Prove selected Fleet model routing before packaging
        if: contains(fromJSON(inputs.selected), 'fleet-model-routing')
        working-directory: candidate
        run: |
          .venv/bin/python -m pytest -q --tb=short \
            tests/test_fleet_policy_store.py tests/test_fleet_comparison_profiles.py \
            tests/test_fleet_difficult_retry.py tests/test_fleet_workers.py \
            tests/test_fleet_supervisor.py tests/test_fleet_reports.py \
            tests/test_fleet_autonomy.py tests/test_fleet_peers.py \
            tests/test_fleet_process_recovery.py tests/test_fleet_capacity.py \
            tests/test_coding_job_contract.py tests/test_fleet_patch_transport.py tests/test_fleet_integration_journal.py tests/test_fleet_windows_git_modes.py
      - name: Prove selected Fleet checkout identity before packaging
        if: contains(fromJSON(inputs.selected), 'fleet-checkout-identity') || contains(fromJSON(inputs.selected), 'fleet-model-routing')
        working-directory: candidate
        run: |
          .venv/bin/python -m pytest -q --tb=short tests/test_fleet_checkout.py tests/test_fleet_shared_learning.py
      - name: Restore the exact candidate tree before packaging
        if: inputs.resume_run != ''
        working-directory: candidate
        run: |
          git restore tests/test_terminal_peer_sleep_ui.py tests/test_workspace_app.py
          git diff --exit-code
      - name: Build stable AppImage without publishing
        working-directory: candidate/apps/desktop
        run: |
          node scripts/configure-release.cjs "v$(node -p 'require("./package.json").version')"
          npm run build:sidecar
          npx --no-install electron-builder --linux AppImage --publish never
      - name: Boot actual packaged stable shell in isolated profile
        working-directory: candidate/apps/desktop
        run: xvfb-run -a node tests/smoke-appimage.js
      - name: Prove chat history in the frozen stable candidate
        run: python scripts/verify-chat-index.py --binary candidate/apps/desktop/build/sidecar/serena-web-sidecar/serena-web-sidecar
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-linux
          path: |
            candidate/apps/desktop/dist/Serena-*.AppImage
            candidate/apps/desktop/dist/latest-linux.yml
          if-no-files-found: error
          retention-days: 14

  windows:
    if: inputs.resume_run == ''
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: candidate-source
      - run: git clone --branch candidate candidate.bundle candidate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and smoke-test Windows without publishing
        working-directory: candidate
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw 'venv failed' }
          npm --prefix apps/desktop ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          $Version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          node apps/desktop/scripts/configure-release.cjs "v$Version"
          if ($LASTEXITCODE -ne 0) { throw 'configure failed' }
          npm --prefix apps/desktop test
          if ($LASTEXITCODE -ne 0) { throw 'desktop tests failed' }
          ./apps/desktop/windows/build-win.ps1
          if (Test-Path apps/desktop/tests/test_voice_packaging.py) {
            ./.venv/Scripts/python.exe -m pytest -q --tb=short tests/test_desktop_dependencies.py apps/desktop/tests/test_voice_packaging.py
            if ($LASTEXITCODE -ne 0) { throw 'desktop voice dependency and packaging tests failed' }
          }
          if (Test-Path tests/test_workspace_chat_trash.py) {
            ./.venv/Scripts/python.exe -m pytest -q --tb=short tests/test_group_unlink_member.py tests/test_autolink.py tests/test_session_recovery.py tests/test_external_runtime_metadata.py tests/test_work_project_metadata.py
            if ($LASTEXITCODE -ne 0) { throw 'chat unlink and recoverable deletion tests failed' }
          }
          if (Test-Path tests/test_fleet_report_visibility.py) {
            ./.venv/Scripts/python.exe -m pytest -q --tb=short tests/test_fleet_report_visibility.py
            if ($LASTEXITCODE -ne 0) { throw 'report visibility tests failed' }
          }
      - name: Prove chat history in the frozen stable candidate
        shell: pwsh
        run: |
          python scripts/verify-chat-index.py --binary candidate/apps/desktop/build/windows-sidecar/serena-web-sidecar/serena-web-sidecar.exe
          if ($LASTEXITCODE -ne 0) { throw 'Frozen chat history continuity failed' }
      - name: Prove selected Fleet model routing before accepting Windows artifacts
        if: contains(fromJSON(inputs.selected), 'fleet-model-routing')
        working-directory: candidate
        shell: pwsh
        run: |
          ./.venv/Scripts/python.exe -m pytest --durations=12 -o faulthandler_timeout=120 -q --tb=short tests/test_fleet_policy_store.py tests/test_fleet_comparison_profiles.py tests/test_fleet_difficult_retry.py tests/test_fleet_workers.py tests/test_fleet_supervisor.py tests/test_fleet_reports.py tests/test_fleet_autonomy.py tests/test_fleet_peers.py tests/test_fleet_process_recovery.py tests/test_fleet_capacity.py tests/test_coding_job_contract.py tests/test_fleet_patch_transport.py tests/test_fleet_integration_journal.py tests/test_fleet_windows_git_modes.py
          if ($LASTEXITCODE -ne 0) { throw 'Fleet model routing tests failed' }
      - name: Prove selected Fleet checkout identity before accepting Windows artifacts
        if: contains(fromJSON(inputs.selected), 'fleet-checkout-identity') || contains(fromJSON(inputs.selected), 'fleet-model-routing')
        working-directory: candidate
        shell: pwsh
        run: |
          ./.venv/Scripts/python.exe -m pytest -q --tb=short tests/test_fleet_checkout.py tests/test_fleet_shared_learning.py
          if ($LASTEXITCODE -ne 0) { throw 'Fleet checkout identity tests failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-windows
          path: |
            candidate/apps/desktop/dist/windows/Serena-*.exe
            candidate/apps/desktop/dist/windows/Serena-*.blockmap
            candidate/apps/desktop/dist/windows/latest.yml
          if-no-files-found: error
          retention-days: 14

  finish:
    if: always() && needs.linux.result == 'success' && (needs.windows.result == 'success' || (inputs.resume_run != '' && needs.windows.result == 'skipped'))
    needs: [linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix apps/desktop ci --ignore-scripts
      - run: node --test tests/promotion-publication.test.cjs
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-*
          path: artifacts
          merge-multiple: true
      - name: Verify checksums; publish only when explicitly requested
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_REQUEST: ${{ inputs.request }}
          PROMOTION_MODE: ${{ inputs.mode }}
        run: node scripts/publish-promotion.cjs
