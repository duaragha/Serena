appId: ai.serena.desktop
productName: Serena
copyright: Copyright © 2026 Raghav
asar: true
electronUpdaterCompatibility: ">=2.16"

extraMetadata:
  main: windows/main-win.js

directories:
  output: dist/windows

files:
  - main.js
  - preload.js
  - runtime.js
  - menu.js
  - updates.js
  - windows/main-win.js
  - package.json

extraResources:
  - from: build/windows-sidecar/serena-web-sidecar
    to: sidecar
    filter:
      - "**/*"

artifactName: Serena-Setup-${version}-${arch}.${ext}

win:
  executableName: Serena
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Serena
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  differentialPackage: true
  packElevateHelper: true

# Passing --config makes electron-builder read THIS file and ignore the "build"
# block in package.json, so the feed has to be repeated here rather than
# inherited. A test asserts the two stay identical: if they drift, one platform
# quietly stops seeing updates, or worse, publishes into the private repo.
#
# serena-releases is public and holds only artifacts. Pointing the feed at the
# private source repo would mean shipping a GitHub token inside every install.
publish:
  - provider: github
    owner: duaragha
    repo: serena-releases
    releaseType: release
