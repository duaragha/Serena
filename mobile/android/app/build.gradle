apply plugin: 'com.android.application'

def serenaCallHost = (System.getenv('SERENA_CALL_HOST') ?: '100.116.233.56').trim()
if (!(serenaCallHost ==~ /[0-9a-fA-F:.]+/)) {
    throw new GradleException('SERENA_CALL_HOST must be a numeric tailnet address')
}
def serenaCallBytes = null
if (serenaCallHost.contains('.') && !serenaCallHost.contains(':')) {
    def octets = serenaCallHost.split(/\./, -1)
    if (octets.size() == 4 && octets.every { value ->
        value ==~ /\d{1,3}/ && value.toInteger() <= 255
    }) {
        serenaCallBytes = octets.collect { value -> value.toInteger() }
    }
} else if (serenaCallHost.contains(':') && !serenaCallHost.contains('.')) {
    try {
        def address = java.net.InetAddress.getByName(serenaCallHost)
        if (address.address.size() == 16) {
            serenaCallBytes = address.address.collect { value -> value & 0xff }
        }
    } catch (java.net.UnknownHostException ignored) {
        serenaCallBytes = null
    }
}
if (serenaCallBytes == null) {
    throw new GradleException('SERENA_CALL_HOST is not a valid numeric address')
}
def serenaCallIsTailnet =
    (serenaCallBytes.size() == 4 &&
        serenaCallBytes[0] == 100 &&
        serenaCallBytes[1] >= 64 && serenaCallBytes[1] <= 127) ||
    (serenaCallBytes.size() == 16 &&
        serenaCallBytes.take(6) == [0xfd, 0x7a, 0x11, 0x5c, 0xa1, 0xe0])
if (!serenaCallIsTailnet) {
    throw new GradleException(
        'SERENA_CALL_HOST must be inside Tailscale IPv4 100.64.0.0/10 ' +
        'or IPv6 fd7a:115c:a1e0::/48'
    )
}
def serenaCallPort = Integer.parseInt(System.getenv('SERENA_CALL_PORT') ?: '8766')
if (serenaCallPort < 1 || serenaCallPort > 65535) {
    throw new GradleException('SERENA_CALL_PORT must be between 1 and 65535')
}

android {
    namespace = "sh.serena.app"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    defaultConfig {
        applicationId "sh.serena.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "SERENA_CALL_HOST", "\"${serenaCallHost}\""
        buildConfigField "int", "SERENA_CALL_PORT", serenaCallPort.toString()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
