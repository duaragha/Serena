<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data: blob:;">
  <title>Serena</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Main widget — fills the proper OS window */
    html, body {
      background: #0a0a1a;
    }
    /* One row: the app, then the coding drawer beside it. Opening the drawer
       widens the OS window by the drawer's width, so the stage keeps the room
       it had instead of being covered by a sheet sliding over it. */
    #shell {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: stretch;
      overflow: hidden;
    }
    /* Everything that is not the drawer. It has to be able to give up room, so
       it grows and is allowed to shrink below its content width. */
    #stage {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
    }
    #widget {
      position: absolute;
      inset: 0;
      background: radial-gradient(
        ellipse at center,
        #0e1428 0%,
        #06070f 100%
      );
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    /* Subtle inner top-light highlight for that premium feel */
    #widget::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(120, 180, 255, 0.4) 50%,
        transparent 100%
      );
      pointer-events: none;
    }
    /* Header with state indicator */
    #widget-header {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      z-index: 2;
    }
    /* Brain takes the rest of the widget */
    #brain-container {
      flex: 1;
      position: relative;
      min-height: 0;
      z-index: 0;
    }
    #brain-container canvas {
      -webkit-app-region: no-drag;
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
    /* Overlay sits on top of brain, inside the widget */
    #overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    /* Make interactive elements receive clicks */
    #overlay > * {
      pointer-events: auto;
    }
    /* Hide the original state-indicator — now lives in header */
    #overlay #state-indicator {
      display: none;
    }
  </style>
</head>
<body>
  <div id="shell">
  <div id="stage">
  <div id="widget">
    <!-- Header: state indicator at top of widget -->
    <div id="widget-header">
      <div id="state-dot"></div>
      <span id="state-label">offline</span>
    </div>

    <!-- Brain visualization fills the rest of the widget -->
    <div id="brain-container"></div>
  </div>

  <div id="overlay">
    <!-- Old state indicator (hidden, kept for backwards compat) -->
    <div id="state-indicator">
      <div id="state-dot-legacy"></div>
      <span id="state-label-legacy">offline</span>
    </div>

    <!-- Transcription / response text area -->
    <div id="text-area">
      <div id="transcription" class="text-block hidden"></div>
      <div id="response" class="text-block hidden"></div>
    </div>

    <!-- Dashboard panel (hidden by default) -->
    <div id="dashboard" class="hidden">
      <div class="dashboard-section">
        <h3>Calendar</h3>
        <div id="dash-calendar"><span class="muted">No events</span></div>
      </div>
      <div class="dashboard-section">
        <h3>Weather</h3>
        <div id="dash-weather"><span class="muted">--</span></div>
      </div>
      <div class="dashboard-section">
        <h3>Notifications</h3>
        <div id="dash-notifications"><span class="muted">None</span></div>
      </div>
    </div>
  </div>
  </div><!-- #stage -->
  </div><!-- #shell -->

  <script src="app.js"></script>
  <!-- Import map so unmodified Three.js addons (which import from 'three')
       resolve locally with no CDN, honoring the strict CSP. -->
  <script type="importmap">
    {
      "imports": {
        "three": "./three.min.js",
        "three/addons/": "./three-addons/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    window.THREE = THREE;

    import { BrainVisualizer } from './brain.js';
    import { TranscriptionDisplay } from './transcription.js';
    import { Dashboard } from './dashboard.js';
    import { NotificationManager } from './notifications.js';
    import { CodePanel } from './code-panel.js';

    const container = document.getElementById('brain-container');
    const brain = new BrainVisualizer(container);
    const transcription = new TranscriptionDisplay(container);
    const dashboard = new Dashboard(document.body);
    const notifications = new NotificationManager(document.body);

    // Register brain visualization callbacks via the preload bridge
    window.serena.registerBrain({
      setState: (state) => brain.setState(state),
      showUserText: (text) => transcription.showUserText(text),
      showResponseText: (text) => transcription.showResponseText(text),
      clearText: () => transcription.clear(),
    });

    // Code output panel. It joins the shell row as a column beside the stage,
    // so opening it takes the window's new room rather than the stage's.
    const codePanel = new CodePanel(document.getElementById('shell'));

    function renderSnapshot(snapshot) {
      if (!snapshot) return;
      codePanel.setItemId(snapshot.item_id || null);
      const project = snapshot.project || 'project';
      const state = snapshot.state || 'idle';
      codePanel.setStatus(state === 'working' ? `working on ${project}...` : state);
    }

    // Register code panel callbacks via the preload bridge
    window.serena.registerCodePanel({
      onStart: (data) => {
        // The coding app owns the pane once it is installed; a second job
        // starting must not wipe the job he is reading.
        if (!codePanel.__codingJobsInstalled) {
          codePanel.clear();
          codePanel.setStatus(`working on ${data.project || 'project'}...`);
        }
        codePanel.setItemId(data.item_id || null);
      },
      onEvent: (event) => {
        codePanel.addEvent(event);
      },
      onDone: (data) => {
        codePanel.setStatus('done');
      },
      onSnapshot: (snapshot) => {
        // Draw it. Whether the drawer is on screen is the main process's
        // call -- it owns the window width this column lives in -- and a
        // snapshot arriving is not permission to reopen what he closed.
        renderSnapshot(snapshot);
      },
      onControlResult: (result) => {
        if (result && result.error) codePanel.setStatus(String(result.error));
      },
      onToggle: () => {
        if (codePanel.isVisible) window.serena.hideCodePanel();
        else window.serena.showCodePanel();
      },
    });

    // Store references for dashboard/notifications (accessible via closure)
    window._serenaDashboard = dashboard;
    window._serenaNotifications = notifications;
    window._serenaCodePanel = codePanel;

    // Reloaded. Ask for whatever was on screen back, drawer included if it was
    // open -- and not if he had closed it.
    window.serena.rendererReady();
  </script>
</body>
</html>
